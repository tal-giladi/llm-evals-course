- id: q1
  question: >-
    You are migrating from a Llama-family system to a Qwen-family candidate and validating the change with an
    LLM judge. What does self-preference risk here, and what is the cheapest fix?
  options:
    - >-
      Nothing, because the candidate is a different model from the incumbent and the judge only ever sees the
      answers, not which model wrote them.
    - >-
      The judge may be more generous toward answers written by its own family, so pick a judge from a family
      other than the candidate's before the migration comparison is read as symmetric.
    - >-
      The judge will prefer the candidate because it is newer, so run the comparison twice and average the
      two pass rates before reporting anything.
    - >-
      The risk only applies to pairwise comparisons, so keep the migration study on a binary per-category
      judge and the family question disappears.
  correct: 1
  explanation: >-
    Self-preference is a property of the pair — judge model, system model — not of either alone, and it
    flatters whichever side shares a family with the judge. Choosing a judge from a different family costs
    one line of config and removes the one confound you cannot average away.

- id: q2
  question: >-
    A comparison of two candidate models under your judge shows the incumbent at 90% and the candidate at
    70%. You have measured that two runs of the identical judge on 57 items differ by 12 points. What does
    that establish?
  options:
    - >-
      The 20-point gap is larger than the noise floor, so the incumbent really is better and the migration
      should not go ahead.
    - >-
      The 20-point gap is inside the 12-point floor once you account for the interval, so the study should
      report no difference between the two systems.
    - >-
      The 20-point gap is larger than the floor in size but the wrong test — the floor is measured by
      re-running one judge, while a family bias is measured by swapping the judge, so you need the swap
      before either conclusion.
    - >-
      The floor applies only to pass rates, so a 20-point gap in kappa or accuracy should be judged against
      the raw sample size instead.
  correct: 2
  explanation: >-
    The noise floor answers "could this gap be luck?", which is necessary but not sufficient: it does not
    tell you whether the gap is a bias or the truth. To find out, keep the items fixed and change the
    judge to one from a different family — if the gap shrinks by more than the floor, the original gap was
    the judge, not the systems.

- id: q3
  question: >-
    A panel is labelled "self-preference" and reports that the judge passes one system 12.3 points more than
    another, and a third system 10.5 points less. On which systems did the judge change its mind in the same
    direction?
  options:
    - >-
      None. The changed items run 12 toward pass on one system and 10 toward fail on another, which is the
      shape of re-rolling the same judge rather than a property of it.
    - >-
      The first, where 12 items moved toward pass; the other two moved in mixed directions so they are
      simply noisier samples.
    - >-
      All three, because every difference is larger than the panel's own reported kappa of 0.79.
    - >-
      The first and third, because the systems involved were written by different model families and family
      is the only variable that moved.
  correct: 0
  explanation: >-
    A bias has a direction on every system it touches; a re-roll scatters. Three differences of 12.3, 3.5
    and 10.5 points, with changed items going both ways and sign-test p-values of 0.14, 0.75 and 0.18, are
    the noise floor of one judge measured against itself — a useful control, and not a measurement of any
    bias.

- id: q4
  question: >-
    Your judge is 3B, your candidate system is 7B, and both come from the same family. Someone proposes
    upgrading the judge to a 14B model to remove any self-preference. What is the problem with that plan?
  options:
    - >-
      A 14B judge will be slower and more expensive, but it is the only change that can separate family from
      size once the two are confounded in the menu.
    - >-
      Self-preference scales with size rather than with family, so the upgrade is directionally right and
      only the price is wrong.
    - >-
      Nothing is confounded, because the judge menu on this lab contains five distinct families and one can
      always pick a rung where only size differs.
    - >-
      Size and family are confounded across the judge menu, so upgrading within the same family moves both
      at once and attributes nothing; the fix is a judge from another family, not a bigger one.
  correct: 3
  explanation: >-
    Across this lab's five-rung ladder the biggest kappa step, 0.61 to 0.79, is also the step where the
    family changes, which is the clearest demonstration that the two move together. A larger judge from the
    same family keeps the confound and enlarges the bill; a judge from a different family removes it for the
    price of one config line.