- id: q1
  question: >-
    You are migrating from a Llama-family system to a Qwen-family candidate and validating the change with a
    Qwen-family LLM judge. What does self-preference risk here, and what is the cheapest fix?
  options:
    - >-
      Nothing, because the candidate is a different model from the incumbent and the judge only ever sees the
      answers, not which model wrote them.
    - >-
      The judge is more generous toward answers written by its own family, so the incumbent's score is an
      upper bound and you should pick a judge from a family other than the candidate's before reporting.
    - >-
      The judge will prefer the candidate because it is newer, so run the comparison twice at different seeds
      and take the majority before reporting anything.
    - >-
      The risk only applies to pairwise comparisons, so keep the migration study on a binary per-category
      judge and the family question disappears.
  correct: 1
  explanation: >-
    Self-preference is a property of the pair — judge model, system model — not of either alone, and it
    flatters whichever side shares a family with the judge. Choosing a judge from a different family costs
    one line of config and removes the one confound you cannot average away.

- id: q2
  question: >-
    You want to measure self-preference on your own judges. Which comparison isolates it?
  options:
    - >-
      Score one system's answers with two same-family judges of different sizes and take the average, so the
      size effect cancels out.
    - >-
      Score one system's answers with a small judge and a large judge, and attribute the difference to
      family, since both come from the same provider.
    - >-
      Score the same items with the same judge and the same prompt twice, and call the difference between
      runs a family effect.
    - >-
      Score the same items with the same judge and prompt under two arms that differ only in the family term,
      one system from the judge's family and one from another.
  correct: 3
  explanation: >-
    Only a paired probe holds size, prompt, decoding and item set fixed, leaving family as the only thing that
    moved. On this lab's own menu the three Qwen-family judges read system C at 35.1%, 26.3% and 15.8%, so
    any comparison across the menu is measuring size and calling it family.

- id: q3
  question: >-
    A family-matched probe moves one system by +10.5 points of pass rate and leaves the other two within 3.5
    points either way. On the system that moved, the true-negative rate falls from 80.8% to 69.2% and the
    false alarms rise from 10 to 16. What is the strongest statement that is true?
  options:
    - >-
      The bias is real in shape and lands where the probe predicted, but at this size the pass-rate change is
      inside the run-to-run noise floor, so it is a hypothesis rather than a measured effect.
    - >-
      The effect is confirmed, because a change of that size in the pass rate cannot be produced by chance on
      57 items.
    - >-
      The probe failed, because a family bias should raise the true-negative rate on the matched system rather
      than lower it.
    - >-
      The effect is confirmed, because a falling true-negative rate on one system while the other two improve
      is the signature of a family prior.
  correct: 0
  explanation: >-
    Two runs of this judge differ by 12 to 14 points of pass rate on 57 items about one time in twenty, and
    the sign test on the pass-rate change is p = 0.29 — so the shape is right and the size is not yet
    established. The TNR fall is the reason to keep probing; it is not by itself proof the magnitude is real.

- id: q4
  question: >-
    The same probe gives +26.3 points on the 57 dev items, with fifteen of fifteen changed items moving toward
    pass. On the 37 held-out items the identical comparison moves five items and lands at +2.7. What do you
    write in the migration study?
  options:
    - >-
      The +26.3 figure, because the held-out split is only 37 items and the dev set is the larger and more
      representative sample.
    - >-
      Neither, because a family prior cannot be measured inside a single lab and the result should be
      discarded until a real judge model is available.
    - >-
      Both figures, with the split named, and a recommendation to change the judge family — since the shape
      held on both splits while the size held on neither consistently.
    - >-
      The dev figure at five repeats and the held-out figure at five repeats, averaged, because averaging the
      two splits is the standard way to report an effect size.
  correct: 2
  explanation: >-
    The probe predicted where the effect would land and it landed there, so the mechanism is credible; the
    held-out split is where the magnitude fails to reproduce. Reporting both is the honest position, and the
    fix that costs nothing — a judge from another family — is available whether or not the size ever settles.