- id: q1
  question: >-
    A gate panel prints `False alarms 0.0%` and `Missed regressions 100.0%`, and every row of its
    nine-cell grid adds to exactly 100%. What does that tell you?
  options:
    - >-
      The two tiles are one event labelled twice, because the simulator builds its "broken" build by writing
      into a copy of the runs that the pass-rate calculation never reads.
    - >-
      Nothing is broken; the two failure modes are rare and nearly exhaustive on this item set, so the sum
      is a coincidence worth recording.
    - >-
      The panel is well calibrated, since two complementary rates are what a correct gate simulator should
      produce for a two-sided test.
    - >-
      The gate never fires, so the miss rate of 100% is the only number on the page that is doing any work.
  correct: 0
  explanation: >-
    Two failure modes measured on two different builds cannot sum to one by construction, and passing a
    planted regression index of 0, 7 or none leaves the false-alarm rate identical to the last decimal
    place. A panel whose two columns are complements is one measurement displayed twice, and the honest
    deliverable from it is a written specification rather than a number anyone should paste into a runbook.

- id: q2
  question: >-
    The simulator is described as 400 trials of a seeded generator, but the seeded generator is created and
    never called and the seed changes nothing across twelve values from 1 to 65535. What does that mean for
    a false-alarm rate you want to quote?
  options:
    - >-
      The rate is exact for this configuration rather than an estimate, so it can be quoted without an
      error bar as long as the configuration is stated.
    - >-
      The rate is a lookup over at most `repeats` distinct comparisons repeated 400 times, so quoting it
      as an estimate implies a variability the number cannot have and a stability it has not earned.
    - >-
      The seed only controls the item draw rather than the trials, so the grid is stable by design and the
      omission from the panel is a documentation gap rather than a measurement one.
    - >-
      The rate should be averaged across seeds before quoting, since a single seed is one sample from the
      distribution the seed parameterises.
  correct: 1
  explanation: >-
    A rate with no error bar is normally a rate measured too few times. Here the trials are not independent
    at all, so the number is exact for the recorded data while carrying none of the variation a real gate
    would have from item mix, judge drift and time of day — which is exactly the variation a reader assumes
    the bar would cover.

- id: q3
  question: >-
    On 94 items with 3 repeats the paired 95% interval on a real 27-point difference is `12.8 to 39.4`, so
    the half-width is 13.3 points. You set the gate's tolerance to 5 points. What follows?
  options:
    - >-
      The tolerance is irrelevant, because the paired interval measures the effect size and not the
      run-to-run variation a nightly gate actually sees.
    - >-
      The gate is strict, because a five-point tolerance catches more regressions than a thirteen-point
      one and strictness is what a release gate is for.
    - >-
      The gate is fine, because the false-alarm rate on the panel reads 0.0% at exactly this setting.
    - >-
      The gate fires on ordinary variation and stays quiet on ordinary variation, because five points is
      38% of the measurement's own width and the threshold is smaller than the noise it sits on.
  correct: 3
  explanation: >-
    A threshold is only interpretable against the width of the quantity it is applied to, and here the two
    are the same order of magnitude. The panel's zero false-alarm reading is itself the artefact from the
    first question, not evidence that the setting is conservative.

- id: q4
  question: >-
    Repeats take the interval half-width on 94 items from 14.4 points at one repeat to 13.3 at three.
    Cutting the item count from 94 to 20 takes it from 13.3 to 30.0. Which buys more, and at what price?
  options:
    - >-
      Repeats, because they reduce verdict noise directly, and they cost one extra judge call per item per
      run rather than a new item.
    - >-
      Repeats, because a majority vote over three samples removes two thirds of the judge's run-to-run
      variation by construction.
    - >-
      Neither, because interval width is a property of the item count alone and repeats never affect it.
    - >-
      Items, because item-sample noise is the larger term; repeats are the expensive way to shrink the
      smaller one, at three times the judge calls for about one point of width.
  correct: 3
  explanation: >-
    Both knobs shrink the width and they are not interchangeable: the item count sets how much the average
    moves when you draw a different set, which dominates here, while repeats only stabilise the verdict on
    the items already chosen. Repeats are per-item per-run cost forever, which is why the item budget is the
    one to defend in a review.

- id: q5
  question: >-
    Your gate reads `Tolerance 5 pts` on the CI tile and the team ships it into CI as a single checkbox.
    A reviewer asks what the checkbox guarantees. Which answer is the one the runbook should contain?
  options:
    - >-
      That on 94 items and 3 repeats the measurement carries a ±13.3-point half-width, the gate fires on
      roughly one run in three with nothing changed, and both of those were accepted in writing.
    - >-
      That the candidate is not worse than the baseline by more than five points, which is the threshold
      expressed as the guarantee the team actually intended.
    - >-
      That the candidate's pass rate has not dropped, because the threshold is what the gate enforces.
    - >-
      That the gate blocks regressions larger than five points, since anything smaller falls under the
      measurement's own noise floor.
  correct: 0
  explanation: >-
    A gate specification is four numbers — the tolerance, the width of the measurement, the accepted
    false-alarm rate and the accepted miss rate — and the first two together are what say whether the
    threshold is strict or random. Writing both errors down is what stops the choice being made silently by
    whoever tunes it last.