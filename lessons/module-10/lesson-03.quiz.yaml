- id: q1
  question: >-
    On the gate panel at 94 items and 3 repeats, the tolerance sweep reads `0 pts → 45.3% / 14.5%`,
    `3 pts → 23.0% / 29.0%`, `5 pts → 10.0% / 52.8%`, `10 pts → 0.3% / 93.8%`. What is the panel telling
    you?
  options:
    - >-
      The two rates are complements of one event, so a gate can only ever be wrong in one direction at a
      time and the crossing point is an artefact.
    - >-
      Nothing, because the simulator plants a fixed tenth of the item set and both columns are therefore
      properties of the simulator rather than of a real pipeline.
    - >-
      The tolerance is the knob that trades the two failure rates against each other, and the two rates cross
      near 3 points, which is the only setting where the team's two risks are balanced.
    - >-
      The false-alarm rate falls because the tolerance is measured on the same pass rate as the regression,
      so a looser gate is mechanically quieter.
  correct: 2
  explanation: >-
    The tolerance sits between the size of the regression and the noise in the measurement, so every
    tightening buys a lower miss rate with a higher false-alarm rate. The crossing point is where the two
    risks are equal, and choosing a tolerance is choosing a point on that curve — which is why the choice
    belongs in an ADR rather than with whoever typed the number.

- id: q2
  question: >-
    At a 5-point tolerance the gate grid reads false alarms `27% / 21% / 10%` as the item count goes 20, 40,
    94, and missed regressions `51% / 62% / 53%`. The callout says more items and more repeats are the only
    knobs that move both rates the right way. What is right?
  options:
    - >-
      The callout is true of the false-alarm column and not of the missed column, because a proportional
      regression costs the same share of the pass rate at 20 items as at 94 and more items only shrink the
      noise around it.
    - >-
      Both columns improve and the missed column's scatter is just the four-hundred-trial noise, so the
      callout is correct once you look at the right resolution.
    - >-
      Neither column improves, because the two knobs act on the same quantity and cancel at a fixed budget
      of judged verdicts.
    - >-
      The missed column does fall if you hold the repeat count at five, so the callout is right about
      repeats and wrong about items.
  correct: 0
  explanation: >-
    The signal is a proportion, so it does not grow with the sample; only the noise shrinks, and shrinking
    noise buys down false alarms and leaves a proportional regression exactly as detectable. Repeats move the
    same false-alarm side and leave the missed column flat at 53% against 52% between three and five
    repeats, which is why the callout's claim needs the column split before it can be checked.

- id: q3
  question: >-
    The simulator plants a block of broken items — a default tenth of the set. Re-running it with one broken
    item gives an 89.8% miss rate and with nineteen gives 5.2%, while the false-alarm rate stays at 10.0%
    throughout. What does that tell you about a miss rate?
  options:
    - >-
      That the miss rate is a property of the gate and the block size is an implementation detail the
      specification can leave out.
    - >-
      That miss rates should be quoted as the best case, since the real regressions are probably smaller
      than the simulator's default block.
    - >-
      That the false-alarm rate is the only stable half of the specification, because it is the one that
      does not depend on the item count.
    - >-
      That a miss rate is always a statement about a named regression, so the gate specification has to say
      what size of regression it is buying detection for before the number means anything.
  correct: 3
  explanation: >-
    The false-alarm rate cannot move when the block changes, because the block exists only in the broken
    build, so the whole of the miss rate's variation is explained by the regression's size against the
    tolerance. A miss rate quoted without the regression it applies to is a number about nothing in
    particular, and naming the regression is the cheapest and most skipped line in the whole specification.

- id: q4
  question: >-
    On 94 items and 3 repeats the paired 95% interval on a real 27-point difference is `12.8 to 39.4`, so the
    half-width is 13.3 points. The regression the gate must catch is 9 broken items out of 94, a 4.26-point
    drop. What follows?
  options:
    - >-
      The tolerance is irrelevant, because the paired interval measures the effect size and not the
      run-to-run variation a nightly gate actually sees.
    - >-
      The gate is fine, because the false-alarm rate on the panel reads 10.0% at exactly this setting.
    - >-
      The regression is a third of the measurement's own half-width, which is why the gate is close to a coin
      on it and why no threshold fixes a signal that far under its noise.
    - >-
      The gate is strict, because a 4.26-point regression is more than a third of the tolerance and a gate
      can resolve anything above a third of its tolerance.
  correct: 2
  explanation: >-
    A threshold is only interpretable against the width of the quantity it is applied to, and here the signal
    is well under that width. More items shrink the width — 30.0, 18.8, 13.3 as the set grows — but a
    4.26-point drop stays a 4.26-point drop at every size, so the only way to catch it reliably is a
    threshold tight enough to fire on it and an honest statement of the false alarms that buys.

- id: q5
  question: >-
    Your gate reads `Tolerance 5 pts` on the CI tile and the team ships it as a single checkbox. A reviewer
    asks what the checkbox guarantees. Which answer is the one the runbook should contain?
  options:
    - >-
      That the candidate is not worse than the baseline by more than five points, which is the threshold
      expressed as the guarantee the team actually intended.
    - >-
      That the candidate's pass rate has not dropped, because the threshold is what the gate enforces.
    - >-
      That the gate blocks regressions larger than five points, since anything smaller falls under the
      measurement's own noise floor.
    - >-
      That on 94 items and 3 repeats the measurement carries a ±13.3-point half-width, the gate blocks about
      one healthy build in ten and misses about half of the one-in-ten breaks, and both of those were
      accepted in writing.
  correct: 3
  explanation: >-
    A gate specification is four numbers — the tolerance, the width of the measurement, the accepted
    false-alarm rate and the accepted miss rate — plus the size of the regression the miss rate applies to.
    The first two together say whether the threshold is strict or random, and writing both errors down is what
    stops the choice being made silently by whoever tunes it last.