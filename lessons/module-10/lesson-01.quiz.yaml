- id: q1
  question: >-
    On the module's default preset the two systems pass 52 of 94 and 27 of 94 items, the difference tile
    reads `+26.6 pts` and the panel lists 10 fixed, 35 broke. What is the relationship between those three
    numbers?
  options:
    - >-
      The difference is exactly `(broke − fixed) / n`, so the two pass rates and the tile are the same
      measurement twice, and the flip list is the only part that names which items moved.
    - >-
      The difference is the average of the two pass rates, and the flip list is a separate sample run on a
      second set of items to confirm the direction.
    - >-
      The difference is the 95% interval width, and the flip list is truncated to the first fourteen rows
      the panel can render.
    - >-
      The difference is the sign-test p-value rescaled to points, which is why it agrees with the fixed and
      broke counts to one decimal place.
  correct: 0
  explanation: >-
    25 of 94 is 26.6 points, and 25 is also 52 − 27 and 35 − 10. One underlying count is being reported in
    three forms, so only the list carries information the other two have thrown away — and the truncation
    the panel prints is only safe because the missing-row count is stated rather than hidden.

- id: q2
  question: >-
    A candidate scores `+4.3 pts` against its baseline, the 95% interval runs `-2.1 to 10.6`, and the sign
    test prints `0.344` on a 7-against-3 split. What does this run support?
  options:
    - >-
      The candidate is better, because the point estimate is positive and every statistic points the same
      way once you drop the negative end of the interval.
    - >-
      Nothing directional: the interval contains zero and the sign test agrees, so the run supports a
      recorded non-result rather than a release decision.
    - >-
      A decision to ship, because ten disagreements is enough for a sign test and it failed to reject.
    - >-
      A decision to block, because an interval that reaches 2.1 points below zero is evidence the candidate
      is worse at least some of the time.
  correct: 1
  explanation: >-
    Both statistics are answers to the same question and both say no: the plausible range of the difference
    includes zero, and the split of disagreements is what a coin would produce. "We cannot distinguish these
    two systems on these 94 items" is a result you can put in a release note, and it is more useful six
    months later than a rounded sign.

- id: q3
  question: >-
    On the default preset the panel says `10 fixed, 35 broke`, the ten fixed items are shown in full and
    fourteen of the thirty-five broken items are shown with a `…and 31 more` line. Which reading is right?
  options:
    - >-
      The truncation is not acceptable because the panel under-reports the change, and the fixed list
      deserves the first reading because it is the good news for the release.
    - >-
      The truncation is acceptable, but only because the Export button writes the full list, so nobody needs
      to read the rows the panel actually shows.
    - >-
      The truncation is acceptable because the count is printed, and the broke list deserves the first
      reading because every broken item was a working answer that someone will now file a ticket about.
    - >-
      Both lists matter equally, so the correct action is to average the two into a single 26.6-point figure
      before deciding anything about the release.
  correct: 2
  explanation: >-
    A visible count turns a truncation into a disclosure. The asymmetry between the two halves is about
    cost, not sentiment: a fixed item was already broken and nobody will ever hear about it, while a broken
    item turns into a support ticket today and is attributed to this release. Export does not rescue the
    panel — almost nobody exports.

- id: q4
  question: >-
    On the default preset the `Difference` tile reads `+26.6 pts` and is labelled only `Difference`, while the
    list underneath marks thirty-five items `Used to pass, does not any more`. What does the page not tell
    you?
  options:
    - >-
      Which item set the numbers were computed over, because the tile shows a rate and a rate without its
      `n` cannot be checked.
    - >-
      Whether the judge was the same one for both systems, because a difference computed across two judges
      is not a comparison.
    - >-
      Whether the interval was resampled or assumed, because a closed-form interval and a bootstrap give
      different widths on the same data.
    - >-
      Which system the difference is relative to — the tile never says A minus B, and the list is named
      from the candidate's side, so the thirty-five broken rows are what the positive number is made of.
  correct: 3
  explanation: >-
    A signed number needs an owner: swap the two dropdowns and both the sign of the tile and the meaning of
    the glyphs move, so a runbook that records "+26.6" without "A minus B" cannot be re-read by anybody,
    including the person who wrote it. The item count is on the panel and the judge is in the
    configuration, so neither of those is the gap.

- id: q5
  question: >-
    You drag the `Items` knob from 94 down to 10 and the Difference tile goes `+26.6 (12.8 to 39.4), p 0.000`
    to `+0.0 (-40.0 to 40.0), p 1.000`, on the same two systems at the same seed. What just happened?
  options:
    - >-
      The knob picked a fresh random draw each time and ten items is simply not enough to see a 27-point
      difference, so the runbook should record the 94-item number as the estimate.
    - >-
      The draws are nested, so the ten-item set sits inside the 94 — the denominator changed and nothing
      else did, which makes the verdict a property of a knob position rather than of the systems.
    - >-
      The two systems genuinely became indistinguishable at ten items, so the smaller set is the more honest
      measurement and the 94-item result was over-powered.
    - >-
      The bootstrap lost resolution at small n and the interval widened for that reason, so a larger resample
      count would restore the original answer.
  correct: 1
  explanation: >-
    Shrinking the denominator is a real loss of evidence and a real gain in honesty about it, but it is not
    evidence about the systems: the same items, nested, carrying a different verdict. The rule that follows
    is about process — publish only from a frozen, named item set, and treat a knob moved to investigate a
    noisy run as a diagnostic that has to be put back.