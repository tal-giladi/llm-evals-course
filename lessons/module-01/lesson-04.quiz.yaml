- id: q1
  question: >-
    You click a lesson's simulation link and the page is blank. The lesson text above it rendered fine.
    What is the most likely diagnosis?
  options:
    - The lab's data file is corrupt, so the whole course build needs to be regenerated before it can work.
    - Nothing is wrong; a lab page stays blank until you press one of the controls in the left column.
    - Something failed on the client — scripts, browser or storage — so run the device check before blaming
      the course.
    - The lesson is being served from a stale cache, so clearing the site cache should fix it on a reload.
  correct: 2
  explanation: >-
    The markdown always loads and the lab needs JavaScript, ES modules and WebAssembly, so a blank lab
    points at the browser, an extension or a proxy rather than at the content. The device check separates
    the two optional failures from the two that actually block a lab, which is the fastest way to tell a
    broken setup from a broken page.

- id: q2
  question: >-
    A scoreboard reads "Llama 3.2 3B · Plain · 0 shots — kappa 0.43, TPR 86.4%". What does that sentence
    license you to claim?
  options:
    - That a recorded run of that exact configuration, replayed in the lab, agreed with the human labels
      at kappa 0.43.
    - That Llama 3.2 3B agrees with people 86.4% of the time when it is used as a judge.
    - That Llama 3.2 3B is a weaker judge than the rubric variant shown in the same lab's menu.
    - That the statistics in the lab are illustrative, while the verdicts behind them are real outputs.
  correct: 0
  explanation: >-
    The verdicts are generated by a seeded model of judge behaviour and replayed, so the honest subject of
    the number is the recorded run, not the model named on the menu. The arithmetic is computed for real
    in your browser, which is why the kappa and the intervals mean something, and why neither one is a
    published benchmark for any named model.

- id: q3
  question: >-
    The device check reports that local storage is blocked in your browser. What follows for the rest of
    the course?
  options:
    - The labs cannot run, because a pinned baseline has nowhere to be stored between page loads.
    - You must allow storage for the site before any lab will render its scoreboard or its tiles.
    - The check will pass on a second visit, once the browser has finished caching the modules.
    - The labs still work, but a pinned run will not survive a reload, so finish an experiment in one
      sitting.
  correct: 3
  explanation: >-
    Storage is one of the two checks the page marks optional, because nothing is computed in a database:
    every statistic is recomputed in the browser from the shipped verdicts. What you lose is the pin, so
    the practical consequence is a workflow one — complete each comparison before reloading, or keep your
    numbers in a scratch file.

- id: q4
  question: >-
    You have finished module 10 and want the Python, OpenTelemetry and CI material the course plan
    mentions. What is true of the build you are reading?
  options:
    - It is reachable from the judge lab's own controls, once the module 10 knowledge check is passed.
    - >-
      It is not in this build: modules 11 to 15 and the capstone are planned, and modules 1 to 10 stand on
      their own.
    - It is in this build, but the device check's WebGPU row has to pass before it becomes available.
    - It lives in a companion course that shares these labs, so the two are interchangeable from here on.
  correct: 1
  explanation: >-
    The production path is a later build, and nothing in modules 1 to 10 depends on it, on Python or on
    Docker. Saying so up front is cheaper than letting a learner finish the fundamentals path hunting for
    a page that was never going to be there, and it keeps the promise honest in both directions.
