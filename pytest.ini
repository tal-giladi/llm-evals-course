[pytest]
# Keep pytest's scratch inside the repository. The default system temp
# directory is not writable in every environment these labs run in — a
# corporate laptop, a locked-down CI image, a sandbox — and a PermissionError
# in a fixture is a confusing way to learn that nothing is wrong with your code.
addopts = -p no:cacheprovider
testpaths =
    labs/common/tests
    labs/module-11/solution
    labs/module-12/solution
pythonpath = labs/common



